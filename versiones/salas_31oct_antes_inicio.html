<style>
/* Concepto: app de bolsillo para el capitán. Negro y lima del club, cifras grandes en Archivo Black, navegación inferior. */
:root{
  --bg:#0b0c08; --surface:#14160e; --surface2:#1c1f13; --fg:#f2f4e8; --muted:#a2a88e; --line:#2a2e1c; color-scheme:dark;
  --lime:#c6d900; --lime-ink:#11130a; --lime-text:#c6d900; --loss:#ff7d6e; --loss-bg:#3a1f1b;
  --font-display:"Archivo Black","Arial Black",Impact,sans-serif; --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c08; --surface:#14160e; --surface2:#1c1f13; --fg:#f2f4e8; --muted:#a2a88e; --line:#2a2e1c;
  --lime-text:#c6d900; --loss:#ff7d6e; --loss-bg:#3a1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0c08; --surface:#14160e; --surface2:#1c1f13; --fg:#f2f4e8; --muted:#a2a88e; --line:#2a2e1c;
  --lime-text:#c6d900; --loss:#ff7d6e; --loss-bg:#3a1f1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.logo{width:46px;height:46px;border-radius:50%;flex:none;background:#000}
.brand{min-width:0;flex:1}
.brand b{display:block;font-family:var(--font-display);font-size:17px;letter-spacing:.02em;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;flex:none}
.seg button{font:inherit;font-family:var(--font-display);font-size:13px;border:0;background:transparent;color:var(--muted);padding:8px 8px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
header.top{flex-wrap:wrap}
.seg.wide{flex:1 1 100%;order:3}
.seg.wide button{flex:1;padding:8px 0}
.seg.wide button#tK{flex:1.7}
body.club nav.tabs{display:none}
body.club{padding-bottom:24px}
.tm{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;cursor:pointer}
.tm .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tm .hd b{font-family:var(--font-display);font-size:18px}
.tm .hd small{color:var(--muted);font-size:12px}
.tm .ln{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:14px}
.tm .ln small{color:var(--muted);font-size:12px;display:block}
.av{width:46px;height:46px;border-radius:50%;background:var(--lime);color:var(--lime-ink);font-family:var(--font-display);font-size:22px;display:grid;place-items:center;flex:none}
.wait{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;border:1.5px dashed var(--lime-text);color:var(--lime-text)}
.act{display:inline-block;font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:99px;padding:5px 10px;margin:6px 6px 0 0;cursor:pointer;text-decoration:none}
button:focus-visible{outline:2px solid var(--lime-text);outline-offset:2px}
h2{font-family:var(--font-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{display:grid;gap:4px;margin-top:18px}
.hero .big{font-family:var(--font-display);font-size:64px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero .big i{font-style:normal;color:var(--lime-text)}
.hero .cap{color:var(--muted);font-size:13px}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.pip.g{background:var(--lime);color:var(--lime-ink)}
.pip.p{background:var(--loss-bg);color:var(--loss)}
.pip.e{background:var(--surface2);color:var(--muted)}
.last{display:flex;justify-content:space-between;align-items:center;gap:12px}
.last .meta{min-width:0}
.last .meta small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.last .meta b{display:block;font-size:17px;margin-top:2px;overflow-wrap:anywhere}
.score{font-family:var(--font-display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.dif{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.03em}.dif.g{background:var(--lime);color:var(--lime-ink)}.dif.m{background:#3a3414;color:#ffd75e}.dif.d{background:var(--loss-bg);color:var(--loss)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.03em}
.badge.g{background:var(--lime);color:var(--lime-ink)}
.badge.p{background:var(--loss-bg);color:var(--loss)}
.badge.e{background:var(--surface2);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile b{display:block;font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:12px;color:var(--lime-text);font-weight:600}
.slot{display:grid;grid-template-columns:132px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot b{font-weight:600}
.slot span.rec{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.jhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.jhead small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.jhead b{display:block;font-size:17px;margin-top:2px;overflow-wrap:anywhere}
.jhead .right{text-align:right;flex:none}
.pr{display:grid;grid-template-columns:28px minmax(0,1fr) auto 28px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pr .n{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--font-display);font-size:13px}
.pr .names{min-width:0;overflow-wrap:anywhere}
.pr .sets{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr .flag{width:26px;height:26px;font-size:12px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.pcard{display:grid;gap:8px;margin-bottom:10px}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pcard b{font-size:16px;overflow-wrap:anywhere}
.pcard .pct{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--lime-text)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:99px}
.bar.l i{background:var(--loss)}
.sub{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.row{display:grid;grid-template-columns:minmax(0,1fr) 20px 30px 32px 34px 38px 32px;gap:3px;font-size:13px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;min-width:0}
.row.h{border-top:0;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;padding-top:0}
.row .c{text-align:center}
.row .nm{font-weight:600;overflow-wrap:break-word;word-break:normal}
.empty{color:var(--muted);text-align:center;padding:48px 8px}
.empty b{display:block;font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--fg);margin-bottom:6px}
.pr.cal.home{box-shadow:inset 4px 0 0 var(--lime)}
.pr.cal.away{box-shadow:inset 4px 0 0 var(--muted)}
.pr.cal{padding-left:14px}
.ha{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:999px;margin-right:6px}
.ha.h{background:var(--lime);color:var(--lime-ink)}
.ha.a{border:1.5px solid var(--muted);color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;max-width:720px;gap:2px}
nav.tabs button{font:inherit;border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:3px;padding:7px 0;border-radius:12px;font-size:9.5px;font-weight:600;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--lime-ink);background:var(--lime)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease}@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media (min-width:560px){.hero .big{font-size:84px}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
footer.foot{margin-top:28px;padding:14px 0 6px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;text-align:center}
footer.foot b{color:var(--fg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;display:flex;gap:8px;align-items:baseline;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:12px;padding:8px 12px;cursor:pointer}
.chip span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.chip.on span{color:var(--lime-ink)}
.chip.sel{outline:3px solid var(--lime-text);outline-offset:1px}
.btn{font:inherit;font-weight:600;border:0;background:var(--lime);color:var(--lime-ink);border-radius:12px;padding:10px 14px;cursor:pointer}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.x{border:0;background:var(--surface2);color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1}
.cp{width:100%;margin-top:10px;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px}

/* cabecera: el titulo se va al hacer scroll y queda fijo el selector */
header.top{position:sticky;top:calc(env(safe-area-inset-top,0px) - 60px);z-index:5;margin:0 -16px;padding:12px 16px 10px;gap:12px;background:var(--hdr);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border:1px solid #2c3120}
.brand b{font-family:var(--font-display);font-weight:800;font-size:27px;line-height:1;letter-spacing:.005em;text-transform:none}
.brand span{display:block;margin-top:3px;font-size:12.5px;color:var(--muted)}
.seg.wide{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px;flex:1 1 100%;order:3}
.seg.wide button{position:relative;z-index:1;background:transparent!important;box-shadow:none!important;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.01em;text-transform:none;color:var(--muted);padding:6px 0;min-height:38px;transition:color .3s}
.seg.wide button[aria-pressed="true"]{color:var(--lime-ink)}
.seg.wide button .i{margin-right:.25em;vertical-align:-.12em}
.ind{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:11px;background:var(--lime);pointer-events:none}
body.ready .ind{transition:transform .4s cubic-bezier(.3,.8,.2,1),width .4s cubic-bezier(.3,.8,.2,1)}
/* barra inferior */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:696px;margin:0 auto;padding:5px;background:var(--navbg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--navline);border-radius:22px}
nav.tabs .in{position:relative}
nav.tabs .ind{top:0;bottom:0;border-radius:17px;background:var(--wash)}

nav.tabs button[aria-selected="true"]{color:var(--lime-text)}
/* texto */
h2{display:block;margin:30px 0 12px;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.1;letter-spacing:.005em;text-transform:none;color:var(--fg)}
h2::before{content:none}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.empty{padding:56px 12px}
.empty::before{content:"";display:block;width:52px;height:52px;margin:0 auto 16px;border-radius:50%;border:2px solid #2c3120;box-shadow:inset 0 0 0 11px var(--bg),inset 0 0 0 13px var(--lime)}

/* etiquetas */
.ven{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;line-height:1;padding:5px 10px 5px 9px;border-radius:99px;white-space:nowrap}
.ven.h{background:var(--lime);color:var(--lime-ink)}
.ven.a{border:1px solid #3a4029;color:var(--fg)}
.ven .i{margin-right:.3em}
.when{margin-left:auto;font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1;color:var(--lime-text)}
.wait{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;border:1.5px dashed #6b7418;color:var(--lime-text);text-transform:none;letter-spacing:0;font-family:var(--font-body)}
.pend{font-size:12.5px;color:var(--muted)}
.dm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:9px;font-size:13px}
.meter{display:inline-flex;gap:3px}.meter i{width:15px;height:5px;border-radius:3px;background:var(--off)}
.dm.l1 .meter i:nth-child(-n+1){background:var(--lime)}.dm.l2 .meter i:nth-child(-n+2){background:var(--amber)}.dm.l3 .meter i{background:var(--loss)}
.dm .dl{font-weight:600}.dm.l1 .dl{color:var(--lime-text)}.dm.l2 .dl{color:var(--amber)}.dm.l3 .dl{color:var(--loss)}
.howto{margin:0 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:13px;line-height:1.55;color:var(--muted)}.howto b{color:var(--fg)}.hl{display:inline-block;margin:6px 6px 0 0;padding:2px 10px;border-radius:99px;font-weight:600;font-size:12px;border:1px solid currentColor}.hl.l1{color:var(--lime-text)}.hl.l2{color:var(--amber)}.hl.l3{color:var(--loss)}
.tbtn.on{border-color:var(--lime);color:var(--lime-text)}
.top10{margin:10px -76px 0 0;padding:4px 12px 10px;border:1px solid var(--line);border-radius:14px;font-size:13px}
.top10[hidden]{display:none}
.cwd .top10{margin-right:0}
.tl{padding-top:8px}.tl+.tl{border-top:1px solid var(--line);margin-top:10px}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}.th b{font-size:13.5px}.th span{color:var(--muted);font-size:12px;white-space:nowrap}
.tl.us .th b{color:var(--lime-text)}
.tr{display:flex;gap:8px;padding:4px 0;align-items:baseline}.tn{width:16px;color:var(--muted);font-size:12px}.tp{flex:1;min-width:0;line-height:1.3}.tv{font-weight:700;font-variant-numeric:tabular-nums}
.tnote{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.45}
.eqrow .chev{display:inline-block;margin-left:6px;opacity:.55;font-style:normal;transition:transform .2s}.eqrow.open .chev{transform:rotate(90deg)}
.eqp{padding:4px 12px 10px 36px;background:var(--surface2);border-top:1px solid var(--line)}.eqp[hidden]{display:none}
.eqg{display:flex;align-items:baseline;gap:8px;padding:6px 0;font-size:13px}.eqj{width:24px;color:var(--muted);font-weight:700;font-size:12px}.eqr{flex:1;min-width:0}.eqr small{display:block;color:var(--muted);font-size:11.5px}.eqs{font-weight:800;font-variant-numeric:tabular-nums}.eql{width:58px;text-align:right;font-size:12px;font-weight:600}
.eqs.g,.eql.g{color:var(--lime-text)}.eqs.p,.eql.p{color:var(--loss)}.eqs.e,.eql.e{color:var(--amber)}
.eqe{padding:8px 0;color:var(--muted);font-size:13px}
.ig{display:flex;align-items:center;gap:14px;margin:18px 0 0;padding:14px 16px;border:1.5px solid var(--lime);border-radius:18px;color:var(--fg);text-decoration:none;background:linear-gradient(135deg,var(--wash),transparent)}
.crest.inl{display:inline-grid;vertical-align:middle;margin:-3px 9px 0 0}.crest.rv{background:#fff var(--tl) center/cover no-repeat;border-color:rgba(255,255,255,.25);color:transparent}.ig.wa{margin-top:10px}.ig.wa svg{background:#25d366;color:#fff}.ig svg{width:44px;height:44px;flex:none;padding:9px;box-sizing:border-box;border-radius:14px;background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%);color:#fff}.ig span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.ig small{color:var(--lime-text);font-size:12px;font-weight:600;letter-spacing:.02em}.ig b{font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.ig .chev{font-style:normal;color:var(--lime-text);font-size:24px}
.ig:active{transform:scale(.99)}
.thm{margin-left:auto;flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;text-decoration:none}
.thm svg{width:22px;height:22px}.thm small{display:block;font-size:9px;font-weight:700;margin-top:-2px;color:var(--muted)}
.dm small{color:var(--muted);font-size:12.5px}
.act{white-space:nowrap}.act .sd{overflow:hidden;text-overflow:ellipsis;max-width:130px;color:var(--muted);font-weight:400;margin-left:7px}
.act{display:inline-flex;align-items:center;font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--soft);background:transparent;color:var(--fg);border-radius:99px;padding:6px 12px;margin:10px 8px 0 0;cursor:pointer;text-decoration:none}
/* escudos */
.crest{--cs:44px;width:var(--cs);height:var(--cs);flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid #2c3120;font-family:var(--font-display);font-weight:800;font-size:calc(var(--cs)*.4);letter-spacing:.02em;color:#b9c0a6}
.crest.me{background:#000 var(--tl,var(--logo)) center/cover no-repeat;border-color:rgba(198,217,0,.4);color:transparent}
/* proximo partido: una pista vista desde arriba, la red entre los dos equipos */
.ticket{position:relative;overflow:hidden;margin-top:16px;padding:18px 18px 18px;border-radius:26px;border:1px solid var(--soft);background:var(--tkbg)}
.ticket>*{position:relative}
.tk-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.tk-head b{color:var(--fg);font-weight:600;font-size:14px}
.tk-vs{position:relative;display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;margin:18px -6px 20px;padding:16px 0}.tk-team{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0;padding:0 4px}
.tk-team .crest{--cs:64px}
.tk-team b{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1;overflow-wrap:anywhere}
.tk-net{justify-self:center;background:none;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted)}
.dbig{font-family:var(--font-display);font-size:28px;line-height:1.1;margin-top:10px;color:var(--fg);text-transform:uppercase;letter-spacing:.01em}.dbig b{color:var(--lime-text);font-weight:400}.cr .dbig{font-size:22px;margin-top:8px}
.tk-sep{height:1px;background:var(--line);margin:2px 0 18px}
.tk-vs{margin:22px -6px 20px!important}
.tk-when{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tk-wl{display:flex;align-items:center;gap:10px}
.tk-rng{font-size:14px}
.ticket .dbig{font-size:34px;margin-top:16px}
.tk-pl{margin-top:8px;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tk-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.tk-box{background:color-mix(in srgb,var(--fg) 5%,transparent);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.tk-box small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tk-box .dl,.tk-box .dl2{font-family:var(--font-display);font-size:20px;line-height:1.1}
.tk-box em{font-style:normal;font-size:12.5px;color:var(--muted)}
.tk-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.ticket .tk-acts .act{margin:0;padding:9px 14px}
.tk-info{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px}
.ticket .note{margin-top:12px}
.ticket .act{margin-top:12px}
/* marcador */
.board{margin-top:12px;border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden}
.sb-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:18px 12px 12px}
.sb-side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.sb-side b{font-weight:600;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.sb-score{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:64px;line-height:.9}
.sb-score i{width:12px;height:3px;border-radius:2px;background:#39402a}
.sb-score .us.w{color:var(--lime-text)}.sb-score .us.l{color:var(--loss)}.sb-score .us.e{color:var(--fg)}
.sb-score .th{color:var(--muted)}.sb-score .th.w{color:var(--fg)}
.sb-meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 12px;padding:0 14px 16px;font-size:13px;color:var(--muted)}
.sb-pair{display:grid;grid-template-columns:24px minmax(0,1fr) repeat(var(--cols,3),30px);column-gap:6px;align-items:center;padding:11px 14px 10px;border-top:1px solid var(--line);cursor:pointer}
.sb-pair .pn{grid-row:1/3;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:14px;background:var(--loss-bg);color:var(--loss)}
.sb-pair.win .pn{background:var(--lime);color:var(--lime-ink)}
.sb-pair .nm{font-size:14px;line-height:1.35;padding:1px 0;overflow-wrap:anywhere;font-weight:500}
.sb-pair .nm.rv{color:var(--muted);font-weight:400}
.sb-pair .st{font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1.15;text-align:center;color:#6c7359}
.sb-pair .st.t.w{color:var(--fg)}.sb-pair .st.u.w{color:var(--lime-text)}
.sb-pair .pt{display:none;grid-column:2/-1;font-size:12.5px;color:var(--muted);padding:7px 0 1px;line-height:1.5}
.sb-pair.open .pt{display:block}
.sb-pair .pt b{color:var(--fg);font-weight:600}
.sb-foot{display:flex;flex-wrap:wrap;gap:4px 18px;padding:12px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.sb-foot b{color:var(--fg);font-weight:600}
/* temporada */
.season{display:grid;gap:14px}
.rec{display:flex;align-items:flex-end;gap:12px}
.rec .rn{font-family:var(--font-display);font-weight:800;font-size:64px;line-height:.85}
.rec .rn .w{color:var(--lime-text)}.rec .rn .l{color:var(--loss)}
.rec .rl{color:var(--muted);font-size:13px;padding-bottom:4px;line-height:1.25}
.pips{gap:5px}
.pip{width:26px;height:26px;font-family:var(--font-display);font-weight:700;font-size:13px}
.pip.g{background:var(--lime)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);margin:0;border-top:1px solid var(--line)}
.kv>div{padding:12px 0 0 12px;border-left:1px solid var(--line)}
.kv>div:first-child{padding-left:0;border-left:0}
.kv dt{font-size:12.5px;color:var(--muted)}
.kv dd{margin:2px 0 0;font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1;white-space:nowrap}
.kv .w{color:var(--lime-text)}.kv .l{color:var(--loss)}
/* calendario: lista plana */
.cl{margin-top:2px}
.cr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;padding:15px 0;border-top:1px solid var(--line)}
.cl>.cr:first-child{border-top:0}
.cj{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;color:#6c7359}
.cr.home .cj{color:var(--lime-text)}
.rv-n{display:block;font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.cr.done .rv-n,.cr.rest .rv-n{color:var(--muted)}
.cr.rest .rv-n{font-weight:500}
.cm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:7px;font-size:13px;color:var(--muted)}
.cres{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1}
.cres.g{color:var(--lime-text)}.cres.p{color:var(--loss)}.cres.e{color:var(--fg)}
.after{margin-top:0}
/* tarjetas (bocadillos) */
.rc,.kv>div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.rc{display:grid;gap:14px}
.kv{border-top:0;gap:12px}
.kv>div,.kv>div:first-child{padding:14px 16px;border-left:1px solid var(--line)}
.cl{margin-top:2px;display:grid;gap:12px}
.cr{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.cl>.cr:first-child{border-top:1px solid var(--line)}
.cr.done{background:var(--surface)}
.cr.rest{background:transparent;border-style:dashed}
/* club */
.tm{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;cursor:pointer;box-shadow:none;transition:border-color .2s}
.tm:hover{border-color:#3a4220}
.tm-top{display:flex;align-items:center;gap:12px}
.tm-l{width:46px;height:46px;border-radius:14px;flex:none;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:30px}
.tm-n{min-width:0}.tm-n b{display:block;font-family:var(--font-display);font-weight:800;font-size:25px;line-height:1}
.tm-n small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.3}
.tm-r{margin-left:auto;display:flex;gap:5px;flex:none}
.tm-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.tm-row small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:3px}
.tm-row b{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.tm-res{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1;flex:none}
.tm-res.g{color:var(--lime-text)}.tm-res.p{color:var(--loss)}.tm-res.e{color:var(--fg)}
.tm-side{text-align:right;flex:none;display:grid;gap:5px;justify-items:end}
/* parejas, jugadores */
.row.h{text-transform:none;letter-spacing:0;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:none}
.card.pcard{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:15px 0;margin:0}
.card.pcard:first-of-type{border-top:0}
.pcard .pct{font-family:var(--font-display);font-weight:800;font-size:30px;color:var(--lime-text)}.pcard .pct.l{color:var(--loss)}
.bar{height:6px;background:#1f2316}.bar i{background:var(--lime);box-shadow:none}.bar.l i{background:var(--loss)}
.row{border-top:1px solid var(--line)}
.av{background:var(--lime);font-family:var(--font-display);font-weight:800;box-shadow:none}
.btn{border-radius:14px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.view{animation:vin .22s ease both}@keyframes vin{from{opacity:0}to{opacity:1}}}
#splash{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:96px;height:96px;border-radius:50%;animation:sp .9s ease both}
@keyframes sp{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
/* ===== LIMPIO (antes: app/salas_antes_limpio.html) y legible (1 bordes, 2 un solo acento, 3 contraste) ===== */

:root:not([data-theme="light"]) .sb-pair .st{color:#8d9478}

:root:not([data-theme="light"]) .sb-pair .st.u.w{color:var(--lime-text)}

:root:not([data-theme="light"]) .cr.home .cj{color:var(--lime-text)}

.cl{gap:14px}

@media (prefers-reduced-motion:no-preference){

.ticket{isolation:isolate}
.ticket>*{z-index:1}
.ticket::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:var(--foto) center 22%/cover;mix-blend-mode:luminosity;opacity:.6;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 24%,transparent 50%);mask-image:linear-gradient(180deg,#000 0,#000 24%,transparent 50%)}
.ticket::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(90% 38% at 90% 0%,var(--wash),transparent 70%)}
.tk-head{background:color-mix(in srgb,var(--surface2) 55%,transparent)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* ===== estados: inicio, carga, vacio, actualizacion, sin conexion ===== */
#splash{align-content:center;justify-items:center;gap:14px;text-align:center;background:radial-gradient(60% 38% at 50% 40%,color-mix(in srgb,var(--lime) 17%,transparent),transparent 72%),var(--bg)}
.sp-ring{position:relative;width:140px;height:140px;margin-bottom:6px}
.sp-ring svg{position:absolute;left:0;top:0;width:100%;height:100%;transform:rotate(-90deg)}
.sp-ring circle{fill:none}
.sp-ring circle.t{stroke:color-mix(in srgb,var(--fg) 10%,transparent);stroke-width:3}
.sp-ring circle.r{stroke:var(--lime);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:396;stroke-dashoffset:0}
#splash .sp-ring img{position:absolute;left:15px;top:15px;width:110px;height:110px;border-radius:50%;animation:none}
#splash b{font-family:var(--font-display);font-weight:800;font-size:46px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
#splash small{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--lime-text);font-weight:600}
@media (prefers-reduced-motion:no-preference){
@keyframes sp-draw{from{stroke-dashoffset:396}to{stroke-dashoffset:0}}
@keyframes sp-in{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes sp-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-220% 0}}
@keyframes ballb{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sp-ring circle.r{animation:sp-draw 1.1s cubic-bezier(.4,0,.2,1) .25s both}
#splash .sp-ring img{animation:sp-in .6s cubic-bezier(.2,.8,.3,1.1) both}
#splash b{animation:sp-up .6s ease .5s both}
#splash small{animation:sp-up .6s ease .65s both}
#splash.q .sp-ring circle.r,#splash.q .sp-ring img,#splash.q b,#splash.q small{animation:none}
.vac svg .bl{animation:ballb 1.6s ease-in-out infinite}
.sk i,.sk b,.sk em{animation:shim 1.4s linear infinite}
}
.sk{display:grid;gap:14px;padding-top:2px}
.sk i,.sk b,.sk em{display:block;border-radius:12px;background:linear-gradient(100deg,var(--surface2) 30%,color-mix(in srgb,var(--fg) 11%,var(--surface2)) 50%,var(--surface2) 70%);background-size:220% 100%}
.sk .skc{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;display:grid;gap:16px;margin-top:2px}
.sk .skh{height:40px;margin:-18px -18px 0;border-radius:26px 26px 0 0}
.sk .skr{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;justify-items:center;gap:6px;padding:6px 0}
.sk .skt{display:grid;gap:10px;justify-items:center}
.sk .skt i{width:64px;height:64px;border-radius:50%}
.sk .skt b{width:90px;height:20px}
.sk em{width:34px;height:12px}
.sk .sk1{width:78%;height:40px}
.sk .sk2{height:112px;border-radius:20px}
.sk .sk3{height:64px;border-radius:16px}
.sk .skn{width:46%;height:24px;margin:4px 0 -2px}
.vac{display:grid;justify-items:center;text-align:center;gap:10px;padding:34px 8px 8px}
.vac svg{width:210px;height:auto;margin-bottom:6px}
.vac svg .ln{stroke:color-mix(in srgb,var(--fg) 26%,transparent);stroke-width:2}

.vac svg .bl{fill:var(--lime)}
.vac>b{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.05;color:var(--fg)}

.upd{display:flex;width:max-content;max-width:100%;align-items:center;gap:8px;margin:14px 0 0;padding:7px 13px 7px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}

body.offl .upd{display:none}
.off{display:flex;align-items:center;gap:12px;margin:14px 0 0;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--amber) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);color:var(--fg);font-size:13.5px;line-height:1.35}

.off span{color:var(--muted);font-size:12.5px}

.cl2{display:flex;flex-direction:column;gap:10px}
.cwg{border-radius:16px;background:var(--surface);overflow:hidden}
.cw{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}

.cwg.nx{background:var(--surface2);border:1px solid var(--lime)}
.cwg.nx .cwn{color:var(--lime-text)}.cwg.nx .cwt b{font-size:18px}

.cwd{padding:0 14px 14px}

.lgd{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);margin:0 0 12px}

.cd{margin-top:18px;padding:14px 16px 16px;border-radius:16px;background:color-mix(in srgb,var(--fg) 5%,transparent);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px}

.cd{position:relative}
.cd:not(.end)::before{content:"";position:absolute;inset:0;border-radius:16px;padding:2px;background:conic-gradient(var(--lime) var(--p,100%),color-mix(in srgb,var(--fg) 10%,transparent) 0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}

.lv-state{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.lv-dot{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.lv-state.fin .lv-dot{background:var(--lime-text);box-shadow:0 0 0 3px var(--wash)}
.lv-saved{border:1px solid var(--soft);border-radius:99px;min-height:30px;display:inline-flex;align-items:center;padding:0 12px;font-size:12px;font-weight:600;color:var(--muted)}
.lv-chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.lv-chip{border-radius:12px;padding:6px 2px 5px;text-align:center;display:grid;gap:1px;background:var(--surface2);border:1.5px solid transparent}
.lv-chip i{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.lv-chip b{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1;font-variant-numeric:tabular-nums}
.lv-chip.win{background:var(--lime)}.lv-chip.win i,.lv-chip.win b{color:var(--lime-ink)}
.lv-chip.loss{background:var(--loss-bg)}.lv-chip.loss i,.lv-chip.loss b{color:var(--loss)}
.lv-chip.live{background:transparent;border:1.5px dashed var(--lime-text)}.lv-chip.live b{color:var(--lime-text)}
.lv-pairs{display:flex;flex-direction:column;gap:12px}
.lv-pair{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:12px}
.lv-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.lv-tag{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;background:var(--surface2);color:var(--muted)}
.lv-pair.is-win .lv-tag{background:var(--lime);color:var(--lime-ink)}
.lv-pair.is-loss .lv-tag{background:var(--loss-bg);color:var(--loss)}
.lv-nc{display:grid;gap:2px;min-width:0}
.lv-names{min-width:0;width:100%;background:transparent;border:0;border-bottom:1px dashed var(--soft);font-weight:600;font-size:16px;padding:4px 0;text-overflow:ellipsis;border-radius:0}
.lv-names::placeholder{color:var(--muted);font-weight:400}
.lv-tbx{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lv-time{background:transparent;border:0;font-size:16px;font-weight:500;letter-spacing:0;color:var(--muted);padding:2px 0;min-height:28px}
.lv-res{display:grid;gap:4px;justify-items:end}
.lv-res b{font-family:var(--font-display);font-size:36px;line-height:.9;font-weight:800;font-variant-numeric:tabular-nums}
.lv-pair.is-win .lv-res b{color:var(--lime-text)}.lv-pair.is-loss .lv-res b{color:var(--loss)}
.lv-pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.lv-pill.win{background:var(--lime);color:var(--lime-ink)}.lv-pill.loss{background:var(--loss-bg);color:var(--loss)}
.lv-pill.live{background:transparent;border:1.5px dashed var(--lime-text);color:var(--lime-text);padding:1.5px 9px}
.lv-sets{display:grid;gap:6px}
.lv-set,.lv-setcols{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.lv-setcols span{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.lv-sl{font-size:13px;color:var(--muted);font-weight:500}
.lv-step{display:grid;grid-template-columns:44px minmax(28px,1fr) 44px;align-items:center;background:var(--surface2);border-radius:14px;overflow:hidden}
.lv-step button{height:46px;border:0;background:transparent;font-size:24px;font-weight:500;cursor:pointer;color:var(--muted)}
.lv-step button:active:not(:disabled){background:var(--line);color:var(--fg)}
.lv-step output{font-family:var(--font-display);font-weight:800;font-size:32px;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.lv-set.lw .lv-step.us output,.lv-set.ll .lv-step.th output{color:var(--lime-text)}
.lv-set.lw .lv-step.th output,.lv-set.ll .lv-step.us output{color:var(--loss)}
.lv-set.xo{opacity:.36}.lv-set.xo button{cursor:default}
.lv-quick{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.lv-quick[hidden]{display:none}
.lv-qh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lv-qt{font-family:var(--font-display);font-weight:700;font-size:19px}
.lv-seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.lv-seg button{border:0;background:transparent;border-radius:11px;min-height:36px;padding:0 14px;font-family:var(--font-display);font-weight:700;font-size:17px;cursor:pointer;color:var(--muted)}
.lv-seg button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
.lv-qc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.lv-qc button{min-height:42px;border-radius:99px;border:1px solid var(--soft);background:transparent;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:18px;padding:0}
.lv-qc button:active{background:var(--surface2)}
.lv-pickrow{display:flex}
.lv-pick{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--soft);background:transparent;cursor:pointer;font-weight:600;font-size:13.5px}
.lv-pick[aria-expanded="true"]{background:var(--wash);border-color:var(--lime)}
.lv-roster{display:grid;gap:8px;background:var(--surface2);border-radius:14px;padding:10px 12px}
.lv-roster[hidden]{display:none}
.lv-rc{display:flex;flex-wrap:wrap;gap:6px}
.lv-rc button{min-height:38px;border-radius:99px;border:1px solid var(--soft);background:transparent;padding:0 12px;font-weight:600;font-size:14px;cursor:pointer}
.lv-rc button.used{opacity:.4}.lv-rc button.sel{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.lv-sec{display:grid;gap:10px}
.lv-sec h2{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.1;margin:10px 0 0}
.lv-mh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lv-mh h2{margin:0}
.lv-sync{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1.5px dashed var(--lime-text);color:var(--lime-text)}
.lv-sync.ok{border-style:solid;background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.lv-bubble{background:#1f3a1b;color:var(--fg);border-radius:18px 18px 18px 4px;padding:13px 15px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.45;user-select:text;border:1px solid var(--line)}
.lv-hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5}
.lv-opts{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.lv-opts input{width:20px;height:20px;accent-color:var(--lime)}
.lv-reset{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lv-reset[hidden]{display:none}
.lv-ghost{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--soft);background:transparent;cursor:pointer;font-weight:600;font-size:14px}
.lv-ghost.danger{color:var(--loss);border-color:rgba(255,125,110,.45)}
.lv-fbar{position:fixed;z-index:3;margin:0 auto;max-width:696px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;background:var(--navbg);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:flex;gap:6px}
.lv-btn{min-height:48px;border-radius:17px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 16px;white-space:nowrap}
.lv-btn.primary{flex:1;background:var(--lime);color:var(--lime-ink);border:0}
.lv-btn.secondary{border:1px solid var(--soft);background:transparent;width:48px;padding:0}
.lv-btn:disabled{opacity:.35;cursor:default}
.lv input:focus-visible,.lv button:focus-visible,.lv select:focus-visible{outline:2px solid var(--lime-text);outline-offset:2px}
.lv-chips{grid-template-columns:repeat(var(--n,5),minmax(0,1fr))}
.lv-tsel{background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--fg);font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;min-height:34px;padding:0 8px;max-width:100%}
.lv-td{display:grid;gap:10px}
.lv-tr{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface2);border-radius:14px;padding:8px 10px}
.lv-tr b{font-family:var(--font-display);font-weight:800;font-size:18px}
.lv-tr input{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);font-size:16px;font-weight:600;min-height:40px;padding:0 8px}
.lv-tr span.m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.lv-x{width:40px;height:40px;border-radius:12px;border:1px solid var(--soft);background:transparent;cursor:pointer;font-size:20px;color:var(--loss)}
.lv-trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lv-cnt{display:inline-flex;align-items:center;background:var(--surface2);border-radius:14px;overflow:hidden}
.lv-cnt button{width:44px;height:44px;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--fg)}
.lv-cnt output{min-width:70px;text-align:center;font-weight:600;font-size:14px}
.lv-rm{color:var(--loss);border-color:rgba(255,125,110,.45)}
@media (max-width:380px){.lv-qc button{font-size:16px}}

/* === Zonas del ranking (referencia Fase II) === */

.eqrow.zo{box-shadow:inset 3px 0 0 var(--zo)}.eqrow.zp{box-shadow:inset 3px 0 0 var(--zp)}.eqrow.zb{box-shadow:inset 3px 0 0 var(--zb)}

.zlg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 0;font-size:12px;color:var(--muted)}
.zlg span{display:flex;align-items:center;gap:6px}.zlg i{width:10px;height:10px;border-radius:3px;background:var(--zo)}
.zlg .p i{background:var(--zp)}.zlg .b i{background:var(--zb)}
.zn{margin-top:6px;font-size:12px;line-height:1.45;color:var(--muted)}
