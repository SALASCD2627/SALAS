# Envia una notificacion al movil de quien se haya apuntado a un equipo.
# Se lanza al cambiar el archivo aviso.json. Necesita el secreto ONESIGNAL_REST_KEY (el App ID es publico y va aqui).
name: Aviso a los equipos
on:
  push:
    paths: ['aviso.json']
  workflow_dispatch:
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar con OneSignal
        env:
          APP_ID: d6fcadb2-a54b-487e-9f5e-c41b4604c39a
          REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$REST_KEY" ]; then echo "Falta el secreto ONESIGNAL_REST_KEY"; exit 1; fi
          jq -e '.equipos|length>0' aviso.json >/dev/null || { echo "Sin equipos"; exit 0; }
          BODY=$(jq -c --arg app "$APP_ID" '{
            app_id:$app, target_channel:"push",
            headings:{es:.titulo,en:.titulo}, contents:{es:.texto,en:.texto},
            url:("https://salascd2627.github.io/SALAS/?e="+.equipos[0]),
            filters:([.equipos[]|{field:"tag",key:("eq_"+.),relation:"=",value:"1"}] | reduce .[1:][] as $f ([.[0]]; . + [{operator:"OR"},$f]))
          }' aviso.json)
          echo "$BODY" | jq .
          curl -sS -X POST "https://api.onesignal.com/notifications?c=push" \
            -H "Authorization: Key $REST_KEY" -H "Content-Type: application/json" -d "$BODY" | tee resp.json
          jq -e '.id' resp.json >/dev/null
